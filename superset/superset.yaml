services:
  # Metadados do Superset (não é seu DW; é o banco interno do Superset)
  superset-db:
    image: postgres:16
    container_name: superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Cache / async (Superset usa Redis para cache e Celery)
  superset-redis:
    image: redis:7
    container_name: superset-redis
    restart: unless-stopped

  # Inicializa Superset (cria tabelas, usuário admin, etc)
  superset-init:
    image: apache/superset:latest
    container_name: superset-init
    depends_on:
      - superset-db
      - superset-redis
    environment:
      SUPERSET_SECRET_KEY: "troque_isto_por_uma_chave_grande_e_forte"
      SUPERSET_LOAD_EXAMPLES: "no"
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: superset
      DATABASE_PORT: "5432"
      DATABASE_USER: superset
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
    command: >
      /bin/bash -lc "
      superset db upgrade &&
      superset fab create-admin
        --username admin
        --firstname Admin
        --lastname User
        --email admin@local
        --password admin &&
      superset init
      "
    restart: "no"

  # Superset Web
  superset:
    image: apache/superset:latest
    container_name: superset
    depends_on:
      - superset-db
      - superset-redis
      - superset-init
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "troque_isto_por_uma_chave_grande_e_forte"
      SUPERSET_LOAD_EXAMPLES: "no"
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: superset
      DATABASE_PORT: "5432"
      DATABASE_USER: superset
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
    command: >
      /bin/bash -lc "superset run -h 0.0.0.0 -p 8088"
    restart: unless-stopped

  # Apache Drill
  drill:
    image: apache/drill:1.22.0
    container_name: drill
    ports:
      - "8047:8047"   # Web UI
      - "31010:31010" # JDBC/ODBC
    # Opcional: persistir / mapear dados locais para o Drill ler arquivos
    volumes:
      - ./drill-data:/data
    restart: unless-stopped

volumes:
  superset_db_data: